name: SonarQube

on:
  workflow_call:
    inputs:
      project_key:
        description: Override del projectKey. Default = nombre del repo.
        required: false
        type: string
        default: ""
      lang:
        required: false
        type: string
        default: ""
      node_version:
        required: false
        type: string
        default: "24"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver projectKey
        id: pk
        shell: bash
        run: |
          key="${{ inputs.project_key }}"
          if [ -z "$key" ]; then
            key="${{ github.event.repository.name }}"
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "projectKey: $key"

      - name: Validar configuracion
        shell: bash
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::vars.SONAR_HOST_URL vacio (definir https://sonarqube.worldbinary.pro)"; exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::secrets.SONAR_TOKEN vacio"; exit 1
          fi

      - uses: actions/setup-node@v4
        if: ${{ inputs.lang == 'node' && hashFiles('package.json') != '' }}
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cobertura (lcov)
        id: cov
        if: ${{ inputs.lang == 'node' && hashFiles('package.json') != '' }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npx --yes c8@10 --reporter=lcov --reporter=text-summary npm test --if-present

      - name: Args de cobertura
        id: covargs
        shell: bash
        run: |
          if [ -s coverage/lcov.info ]; then
            echo "args=-Dsonar.javascript.lcov.reportPaths=coverage/lcov.info" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin coverage/lcov.info: Sonar vera 0% de cobertura"
          fi

      - name: SonarQube Scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ steps.pk.outputs.key }}
            -Dsonar.projectName=${{ steps.pk.outputs.key }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ steps.covargs.outputs.args }}

      - name: Reporte Quality Gate (informativo)
        if: always()
        shell: bash
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
          TOKEN: ${{ secrets.SONAR_TOKEN }}
          KEY: ${{ steps.pk.outputs.key }}
        run: |
          if [ "${{ steps.sonar.outcome }}" = "success" ]; then
            echo "Sonar Quality Gate: PASS (${{ steps.pk.outputs.key }})"
          else
            echo "::warning::Sonar Quality Gate: FAILED (INFORMATIVO, no bloquea el merge). Reactivar bloqueante tras las pruebas. Dashboard: ${{ vars.SONAR_HOST_URL }}/dashboard?id=${{ steps.pk.outputs.key }}"
            curl -sf -u "$TOKEN:" "$HOST/api/qualitygates/project_status?projectKey=$KEY" \
              | jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "::error::Sonar \(.metricKey): \(.actualValue) (umbral \(.comparator) \(.errorThreshold))"' \
              || echo "::warning::No se pudieron leer las condiciones del Quality Gate"
          fi
